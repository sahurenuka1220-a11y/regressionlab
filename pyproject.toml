[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regressionlab"
version = "1.0.0"
description = "Linear, polynomial and ridge regression from scratch with NumPy, plus CLI and Streamlit app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.scripts]
regressionlab = "regressionlab.cli:main"

[tool.setuptools.packages.find]
include = ["regressionlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
